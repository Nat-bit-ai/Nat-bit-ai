<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="360" viewBox="0 0 900 360" fill="none" role="img" aria-label="GitSkins styled hero section for Natnael Zerihun">
  <defs>
    <!-- GitSkins Canvas Background -->
    <linearGradient id="gs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="54%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- GitSkins Ambient Orbs -->
    <radialGradient id="orb-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#39d353" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#a371f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Avatar Ring Glow Gradient -->
    <linearGradient id="ring-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="title-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>

    <!-- Inner Card BG -->
    <linearGradient id="inner-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(8,12,20,0.65)" />
      <stop offset="100%" stop-color="rgba(12,18,28,0.75)" />
    </linearGradient>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 850; font-size: 32px; fill: #ffffff; letter-spacing: -0.5px; }
    .title-accent { fill: url(#title-accent); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 15px; fill: #8b949e; }
    .bio { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 13.5px; fill: #8b949e; }
    .bio-highlight { fill: #58a6ff; font-weight: 600; }
    .terminal-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11.5px; fill: #39d353; }
    .terminal-sub { fill: #8b949e; }
    .btn-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #e6edf3; }
    .metric-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 850; font-size: 18px; fill: #ffffff; }
    .metric-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #8b949e; }
    .gs-brand { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #8b949e; fill-opacity: 0.45; }
  </style>

  <!-- GitSkins Outer Container Box -->
  <rect width="900" height="360" rx="20" fill="url(#gs-bg)" stroke="#58a6ff" stroke-opacity="0.65" stroke-width="1.5" />
  
  <!-- Ambient Orbs -->
  <ellipse cx="140" cy="50" rx="220" ry="120" fill="url(#orb-blue)" />
  <ellipse cx="720" cy="60" rx="240" ry="110" fill="url(#orb-green)" />
  <ellipse cx="500" cy="320" rx="300" ry="90" fill="url(#orb-purple)" />
  <ellipse cx="840" cy="300" rx="180" ry="110" fill="url(#orb-cyan)" />

  <!-- GitSkins Inner Frame -->
  <rect x="18" y="18" width="864" height="324" rx="16" fill="rgba(8,8,12,0.55)" stroke="#58a6ff" stroke-opacity="0.4" stroke-width="1" />

  <!-- LEFT COLUMN: Avatar + Status Terminal -->
  <rect x="32" y="32" width="240" height="296" rx="14" fill="url(#inner-card-bg)" stroke="#58a6ff" stroke-opacity="0.3" stroke-width="1" />

  <!-- Glowing Circular Avatar -->
  <circle cx="152" cy="115" r="58" fill="none" stroke="url(#ring-glow)" stroke-width="3" filter="url(#glow-filter)" />
  <circle cx="152" cy="115" r="52" fill="#0d1117" />
  
  <clipPath id="avatar-clip">
    <circle cx="152" cy="115" r="50" />
  </clipPath>
  <image href="https://github.com/Nat-bit-ai.png" x="102" y="65" width="100" height="100" clip-path="url(#avatar-clip)" />

  <!-- Terminal Status Box -->
  <rect x="44" y="194" width="216" height="120" rx="10" fill="#04070d" stroke="#161b22" stroke-width="1" />
  <text x="56" y="220" class="terminal-text terminal-sub">&gt; Building ideas.</text>
  <text x="56" y="238" class="terminal-text terminal-sub">&gt; Solving problems.</text>
  <text x="56" y="256" class="terminal-text terminal-sub">&gt; Shipping solutions.</text>
  <line x1="56" y1="272" x2="248" y2="272" stroke="#161b22" stroke-width="1" />
  <text x="56" y="295" class="terminal-text" font-weight="700">STATUS: ONLINE</text>
  <circle cx="178" cy="291" r="4" fill="#39d353" />

  <!-- RIGHT COLUMN: Header + Description + Buttons + Key Metrics -->
  <text x="296" y="68" class="title">Natnael <tspan class="title-accent">Zerihun</tspan> 👋</text>
  <text x="296" y="94" class="subtitle">Software Developer | Backend &amp; Flutter Enthusiast</text>
  
  <text x="296" y="124" class="bio">I build modern, scalable and beautiful applications. Passionate about</text>
  <text x="296" y="142" class="bio">
    <tspan class="bio-highlight">clean code</tspan>, <tspan class="bio-highlight">problem solving</tspan> and <tspan class="bio-highlight">continuous learning</tspan>.
  </text>

  <!-- Action Pill Buttons -->
  <!-- GitHub -->
  <rect x="296" y="168" width="105" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="#58a6ff" stroke-opacity="0.6" stroke-width="1" />
  <path d="M314 185c0-3.87 2.5-7.14 6-8.3.4-.07.5-.17.5-.38v-1.34c-2.4.52-2.9-1.17-2.9-1.17-.4-.98-.9-1.25-.9-1.25-.8-.53.06-.52.06-.52.9.06 1.35.9 1.35.9.77 1.32 2 1 2.5.75.07-.55.3-.93.53-1.15-1.9-.22-3.9-.96-3.9-4.27 0-.94.34-1.7 0.9-2.3-.1-.22-.4-1.1.1-2.27 0 0 .73-.23 2.4.9.7-.2 1.44-.28 2.18-.28s1.48.09 2.18.28c1.67-1.13 2.4-.9 2.4-.9.5 1.17.2 2.05.1 2.27.56.6 0.9 1.36.9 2.3 0 3.32-2.02 4.04-3.94 4.25.3.27.58.8.58 1.62v2.4c0 .2.1.32.5.25 3.5-1.17 6-4.44 6-8.31 0-4.42-3.58-8-8-8s-8 3.58-8 8z" fill="#ffffff"/>
  <text x="336" y="190" class="btn-text">GitHub</text>

  <!-- LinkedIn -->
  <rect x="413" y="168" width="110" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1" />
  <text x="441" y="190" class="btn-text" fill="#38bdf8">LinkedIn</text>

  <!-- Email Me -->
  <rect x="535" y="168" width="110" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="#c084fc" stroke-opacity="0.6" stroke-width="1" />
  <text x="559" y="190" class="btn-text" fill="#e879f9">Email Me</text>

  <!-- Download CV -->
  <rect x="657" y="168" width="125" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="#39d353" stroke-opacity="0.6" stroke-width="1" />
  <text x="677" y="190" class="btn-text" fill="#39d353">Download CV</text>

  <!-- Metrics Bar -->
  <rect x="296" y="224" width="568" height="96" rx="12" fill="url(#inner-card-bg)" stroke="#58a6ff" stroke-opacity="0.3" stroke-width="1" />
  
  <!-- Projects -->
  <text x="316" y="262" font-size="20">🚀</text>
  <text x="346" y="258" class="metric-label">Projects</text>
  <text x="346" y="282" class="metric-num">11+</text>

  <line x1="432" y1="240" x2="432" y2="304" stroke="#30363d" stroke-width="1" />

  <!-- Commits -->
  <text x="450" y="264" font-family="monospace" font-weight="700" font-size="16" fill="#58a6ff">&lt;/&gt;</text>
  <text x="485" y="258" class="metric-label">Commits</text>
  <text x="485" y="282" class="metric-num">303+</text>

  <line x1="574" y1="240" x2="574" y2="304" stroke="#30363d" stroke-width="1" />

  <!-- Followers -->
  <text x="592" y="262" font-size="20" fill="#f59e0b">⭐</text>
  <text x="622" y="258" class="metric-label">Followers</text>
  <text x="622" y="282" class="metric-num">7+</text>

  <line x1="712" y1="240" x2="712" y2="304" stroke="#30363d" stroke-width="1" />

  <!-- Contributions -->
  <text x="730" y="262" font-size="20">☕</text>
  <text x="760" y="258" class="metric-label">Contributions</text>
  <text x="760" y="282" class="metric-num">358+</text>

  <!-- Watermark -->
  <text x="864" y="336" text-anchor="end" class="gs-brand">gitskins.com style</text>
</svg>
