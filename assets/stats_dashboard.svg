<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" fill="none" role="img" aria-label="GitSkins styled stats dashboard">
  <defs>
    <!-- GitSkins Canvas Background -->
    <linearGradient id="gs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="54%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- GitSkins Ambient Orbs -->
    <radialGradient id="orb-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#39d353" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#a371f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="inner-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(8,12,20,0.65)" />
      <stop offset="100%" stop-color="rgba(12,18,28,0.75)" />
    </linearGradient>
  </defs>

  <style>
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 850; font-size: 16px; fill: #ffffff; letter-spacing: -0.3px; }
    .scan-label { font-family: 'Fira Code', monospace; font-size: 11px; fill: #58a6ff; font-weight: 700; }
    .stat-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 850; font-size: 19px; fill: #58a6ff; text-anchor: middle; }
    .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 10.5px; fill: #8b949e; text-anchor: middle; }
    .btn-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11.5px; fill: #58a6ff; text-anchor: middle; }
    .streak-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #8b949e; }
    .quote-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13.5px; fill: #e6edf3; font-style: italic; }
    .quote-author { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 12px; fill: #a371f7; }
    .gs-brand { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #8b949e; fill-opacity: 0.45; }
  </style>

  <!-- GitSkins Outer Container Box -->
  <rect width="900" height="300" rx="20" fill="url(#gs-bg)" stroke="#58a6ff" stroke-opacity="0.65" stroke-width="1.5" />
  
  <!-- Ambient Orbs -->
  <ellipse cx="140" cy="50" rx="220" ry="110" fill="url(#orb-blue)" />
  <ellipse cx="450" cy="60" rx="240" ry="110" fill="url(#orb-green)" />
  <ellipse cx="760" cy="250" rx="260" ry="90" fill="url(#orb-purple)" />

  <!-- GitSkins Inner Frame -->
  <rect x="18" y="18" width="864" height="264" rx="16" fill="rgba(8,8,12,0.55)" stroke="#58a6ff" stroke-opacity="0.4" stroke-width="1" />

  <!-- CARD 1: GitHub Stats -->
  <rect x="32" y="32" width="270" height="236" rx="14" fill="url(#inner-card-bg)" stroke="#58a6ff" stroke-opacity="0.3" stroke-width="1" />
  
  <text x="48" y="60" class="card-title">📊 GitHub Stats</text>
  <line x1="48" y1="72" x2="286" y2="72" stroke="#21262d" stroke-width="1" />

  <!-- Stats Row 1 -->
  <text x="100" y="102" class="stat-num">303+</text>
  <text x="100" y="118" class="stat-lbl">Total Commits</text>

  <text x="234" y="102" class="stat-num">11+</text>
  <text x="234" y="118" class="stat-lbl">Repositories</text>

  <!-- Stats Row 2 -->
  <text x="100" y="152" class="stat-num">7+</text>
  <text x="100" y="168" class="stat-lbl">Followers</text>

  <text x="234" y="152" class="stat-num">358+</text>
  <text x="234" y="168" class="stat-lbl">Contributions</text>

  <!-- View Profile Button -->
  <rect x="72" y="196" width="190" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="#58a6ff" stroke-opacity="0.6" stroke-width="1" />
  <text x="167" y="217" class="btn-text">View GitHub Profile →</text>

  <!-- CARD 2: Contribution Streak -->
  <rect x="315" y="32" width="270" height="236" rx="14" fill="url(#inner-card-bg)" stroke="#58a6ff" stroke-opacity="0.3" stroke-width="1" />
  
  <text x="331" y="60" class="card-title">🔥 <tspan fill="#f97316">Contribution Streak</tspan></text>
  <line x1="331" y1="72" x2="569" y2="72" stroke="#21262d" stroke-width="1" />

  <!-- Pixel Grid Matrix Simulation -->
  <g transform="translate(331, 80)">
    <text x="0" y="20" font-size="9" fill="#484f58" font-family="sans-serif">Mon</text>
    <text x="0" y="44" font-size="9" fill="#484f58" font-family="sans-serif">Wed</text>
    <text x="0" y="68" font-size="9" fill="#484f58" font-family="sans-serif">Fri</text>

