    <rect x="197" y="10" width="10" height="10" rx="2" fill="#161b22" />
    <rect x="197" y="23" width="10" height="10" rx="2" fill="#006d32" />
    <rect x="197" y="36" width="10" height="10" rx="2" fill="#006d32" />
