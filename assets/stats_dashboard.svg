  <text x="331" y="206" class="streak-text">Current: <tspan fill="#f97316" font-weight="700">5d</tspan> · Longest: <tspan fill="#39d353" font-weight="700">10d</tspan></text>

  <!-- CARD 3: Quote I Live By -->
  <rect x="598" y="32" width="270" height="236" rx="14" fill="url(#inner-card-bg)" stroke="#58a6ff" stroke-opacity="0.3" stroke-width="1" />
  
  <text x="614" y="60" class="card-title">💡 Quote I Live By</text>
  <line x1="614" y1="72" x2="852" y2="72" stroke="#21262d" stroke-width="1" />
  
  <!-- Big Quote Icon -->
  <text x="614" y="112" font-size="40" fill="#58a6ff" font-family="serif">“</text>

  <text x="628" y="124" class="quote-body">Code is like humor. When</text>
  <text x="628" y="144" class="quote-body">you have to explain it, it's</text>
  <text x="628" y="164" class="quote-body">bad.</text>

  <text x="628" y="204" class="quote-author">— Cory House</text>

  <!-- Watermark -->
  <text x="864" y="276" text-anchor="end" class="gs-brand">gitskins.com style</text>
