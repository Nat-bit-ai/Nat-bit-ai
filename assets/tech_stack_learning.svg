<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" fill="none" role="img" aria-label="GitSkins styled tech stack and learning section">
  <defs>
    <!-- GitSkins Canvas Background -->
    <linearGradient id="gs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="54%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- GitSkins Ambient Orbs -->
    <radialGradient id="orb-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#a371f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#39d353" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>

    <!-- GitSkins Bar Gradient Colors -->
    <linearGradient id="bar-flutter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="bar-dart" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="bar-node" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39d353" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="bar-express" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a371f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="bar-postgres" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bar-dsa" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="bar-sys" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <linearGradient id="inner-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(8,12,20,0.65)" />
      <stop offset="100%" stop-color="rgba(12,18,28,0.75)" />
    </linearGradient>
  </defs>

  <style>
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 850; font-size: 20px; fill: #ffffff; letter-spacing: -0.3px; }
    .scan-label { font-family: 'Fira Code', monospace; font-size: 11px; fill: #58a6ff; font-weight: 700; }
    .cat-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12.5px; fill: #8b949e; }
    .item-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #e6edf3; }
    .percent-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 12px; fill: #8b949e; }
    .bar-bg { fill: #161b22; rx: 5px; }
    .bar-fill { rx: 5px; }
    .gs-brand { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #8b949e; fill-opacity: 0.45; }
  </style>

  <!-- GitSkins Outer Container Box -->
  <rect width="900" height="360" rx="20" fill="url(#gs-bg)" stroke="#58a6ff" stroke-opacity="0.65" stroke-width="1.5" />
  
  <!-- Ambient Orbs -->
  <ellipse cx="140" cy="60" rx="240" ry="120" fill="url(#orb-blue)" />
  <ellipse cx="760" cy="70" rx="260" ry="110" fill="url(#orb-purple)" />
  <ellipse cx="450" cy="310" rx="280" ry="80" fill="url(#orb-green)" />

  <!-- GitSkins Inner Frame -->
  <rect x="18" y="18" width="864" height="324" rx="16" fill="rgba(8,8,12,0.55)" stroke="#58a6ff" stroke-opacity="0.4" stroke-width="1" />

  <!-- LEFT CARD: Tech Stack -->
  <rect x="32" y="32" width="405" height="296" rx="14" fill="url(#inner-card-bg)" stroke="#58a6ff" stroke-opacity="0.3" stroke-width="1" />
  
  <text x="52" y="66" class="card-title">🛠️ Tech Stack</text>
  <text x="395" y="66" text-anchor="end" class="scan-label">&gt; stack.scan</text>
  <line x1="52" y1="78" x2="395" y2="78" stroke="#21262d" stroke-width="1" />

  <!-- Languages -->
  <text x="52" y="104" class="cat-title">Languages</text>
  <g transform="translate(52, 112)">







  </g>

  <!-- Frameworks & Tools -->
  <text x="52" y="180" class="cat-title">Frameworks &amp; Tools</text>
  <g transform="translate(52, 188)">







  </g>

  <!-- Databases -->
  <text x="52" y="256" class="cat-title">Databases</text>
  <g transform="translate(52, 264)">

  </g>

  <!-- RIGHT CARD: Currently Learning -->
  <rect x="455" y="32" width="413" height="296" rx="14" fill="url(#inner-card-bg)" stroke="#58a6ff" stroke-opacity="0.3" stroke-width="1" />
  
  <text x="475" y="66" class="card-title">📊 Top Languages</text>
  <text x="848" y="66" text-anchor="end" class="scan-label">&gt; languages.scan</text>
  <line x1="475" y1="78" x2="848" y2="78" stroke="#21262d" stroke-width="1" />

  <text x="495" y="110" class="item-label">HTML</text>
  <text x="605" y="110" class="percent-label" fill="#38bdf8">27%</text>
  <rect x="645" y="101" width="195" height="10" class="bar-bg" />
  <rect x="645" y="101" width="53" height="10" class="bar-fill" fill="url(#bar-flutter)" />

  <text x="495" y="142" class="item-label">Java</text>
  <text x="605" y="142" class="percent-label" fill="#818cf8">23%</text>
  <rect x="645" y="133" width="195" height="10" class="bar-bg" />
  <rect x="645" y="133" width="45" height="10" class="bar-fill" fill="url(#bar-dart)" />

  <text x="495" y="174" class="item-label">Dart</text>
  <text x="605" y="174" class="percent-label" fill="#39d353">18%</text>
  <rect x="645" y="165" width="195" height="10" class="bar-bg" />
  <rect x="645" y="165" width="35" height="10" class="bar-fill" fill="url(#bar-node)" />

  <text x="495" y="206" class="item-label">C++</text>
  <text x="605" y="206" class="percent-label" fill="#c084fc">10%</text>
  <rect x="645" y="197" width="195" height="10" class="bar-bg" />
  <rect x="645" y="197" width="20" height="10" class="bar-fill" fill="url(#bar-express)" />

  <text x="495" y="238" class="item-label">CMake</text>
  <text x="605" y="238" class="percent-label" fill="#60a5fa">7%</text>
  <rect x="645" y="229" width="195" height="10" class="bar-bg" />
  <rect x="645" y="229" width="14" height="10" class="bar-fill" fill="url(#bar-postgres)" />

  <text x="495" y="270" class="item-label">JavaScript</text>
  <text x="605" y="270" class="percent-label" fill="#fbbf24">5%</text>
  <rect x="645" y="261" width="195" height="10" class="bar-bg" />
  <rect x="645" y="261" width="10" height="10" class="bar-fill" fill="url(#bar-dsa)" />

  <text x="495" y="302" class="item-label">Python</text>
  <text x="605" y="302" class="percent-label" fill="#fb7185">4%</text>
  <rect x="645" y="293" width="195" height="10" class="bar-bg" />
  <rect x="645" y="293" width="8" height="10" class="bar-fill" fill="url(#bar-sys)" />

  <!-- Watermark -->
  <text x="864" y="336" text-anchor="end" class="gs-brand">gitskins.com style</text>
</svg>
